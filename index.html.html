<!DOCTYPE html>
<html lang="en">

<head>
    <title>Weather App</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="weather style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover the weather in any city around the world. Get real-time temperature, humidity, and wind speed information quickly and easily.">
</head>

<body>
    <div class="container">
        <h1>Weather App</h1>
        <form>
            <!-- NEW: country dropdown (filled by index.js) -->
            <select id="country-select" aria-label="Select country">
                <option value="">Select Country</option>
            </select>
            <!-- NEW: governorate/city dropdown (hidden until a country is chosen) -->
            <select id="city-select" aria-label="Select governorate or city" hidden></select>
            <input type="text" id="city-input" placeholder="Enter City">
            <input type="submit" value="Get Weather">
        </form>
        <div id="weather-data">
            <div class="icon"><!--<img src="https://openweathermap.org/img/wn/01d.png" alt="Weather Icon">-->
            </div>
            <div class="temperature"><!--22℃--></div>
            <div class="description"><!--Sunny--></div>
            <div class="details">
                <!-- <div>Feels like: 23℃</div> -->
                <!-- <div>Humidity: 40%</div> -->
                <!-- <div>Wind speed: 5 m/s</div> -->
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
